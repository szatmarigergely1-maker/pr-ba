<script>
window.STRNG_CONFIG={"url": "", "anonKey": ""};
(()=>{'use strict';
let KEY='strng_apple_v4'; const OLD_KEYS=['strng_apple_v3'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const pd=s=>new Date(s+'T12:00:00');
const fmtDate=s=>pd(s).toLocaleDateString('hu-HU',{weekday:'short',month:'short',day:'numeric'});
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
const kgFmt=n=>String(n).replace('.',',');
const round25=n=>Math.round(n/2.5)*2.5;
const toSec=t=>{const m=/^(\d{1,2}):([0-5]\d)$/.exec(String(t||'').trim());return m?(+m[1])*60+(+m[2]):null};
const fmtT=s=>{s=Math.round(s);return `${pad(Math.floor(s/60))}:${pad(s%60)}`};
const fmtPace=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${pad(s%60)}`};
const riegel=(t,d1,d2)=>t*Math.pow(d2/d1,1.06);
// Régi mentésekből érkező idők normalizálása (8:30 → 08:30)
function normalizeTime(raw){
  raw=String(raw||'').trim();if(!raw)return '';
  const idx=raw.search(/\D/);let m,s;
  if(idx>=0){m=raw.slice(0,idx).replace(/\D/g,'');s=raw.slice(idx).replace(/\D/g,'')}
  else{const d=raw.slice(0,4);if(d.length<=2){m=d;s=''}else if(d.length===3){m=d[0];s=d.slice(1)}else{m=d.slice(0,2);s=d.slice(2)}}
  return m===''?raw:pad(+m)+':'+pad(+(s||0));
}

function validDate(value) {
 if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
 const d=new Date(value+'T12:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value;
}
function decimal(value){return Number(String(value??'').trim().replace(',','.'))}
function validSet(s){return s&&Number.isFinite(s.kg)&&s.kg>0&&s.kg<=1000&&Number.isInteger(s.reps)&&s.reps>=1&&s.reps<=100&&Number.isInteger(s.count)&&s.count>=1&&s.count<=30}
function cleanSets(sets){return Array.isArray(sets)?sets.slice(0,30).map(s=>({kg:Number(s?.kg),reps:Number(s?.reps),count:Number(s?.count??1)})).filter(validSet):[]}
function actualSets(log){
 if(log.part!=='lift'&&log.part!=='strength')return [];
 const sets=cleanSets(log.sets);if(sets.length)return sets;
 // Old 5/3/1 logs explicitly stored actual AMRAP reps; planned sets are excluded.
 const legacy={kg:Number(log.amrapKg),reps:Number(log.amrapReps),count:1};
 return log.part==='strength'&&validSet(legacy)?[legacy]:[];
}
function strengthSeries(logs,liftKey,metric='weight',repFilter=0){
 const days=new Map();
 for(const log of logs){
  if(log.liftKey!==liftKey||!validDate(log.date))continue;
  const sets=actualSets(log).filter(s=>!repFilter||s.reps===repFilter);if(!sets.length)continue;
  const d=days.get(log.date)||{date:log.date,sets:[],value:0,reps:0,count:0};
  d.sets.push(...sets);days.set(log.date,d);
 }

  d.count=d.sets.reduce((n,s)=>n+s.count,0);

// Kezdő erő: klasszikus hullám, max nélkül. 1. hét 5×5, 2. hét 5×4 (+5%), 3. hét 6×3 (+10%)
const BASIC={1:{sets:5,reps:5,mult:1,name:'Volumen hét'},2:{sets:5,reps:4,mult:1.05,name:'Erő hét'},3:{sets:6,reps:3,mult:1.10,name:'Csúcs hét'}};
const BASIC_WARM=[[.4,5],[.6,3],[.8,2]];
const basicKg=(key,week)=>state.work[key]?round25(state.work[key]*BASIC[week].mult):null;
// Conservative application policy, not a claim of universal validation below ten reps.
// Research: https://pubmed.ncbi.nlm.nih.gov/39495260/ (2025; recommends 4–10 RTF in tested movements).
// https://arxiv.org/abs/2603.17495 (2026 preprint; no measured maxima; not adopted).
// All raw AMRAP records are retained; no numeric extrapolation above ten reps.
function estimate1RM(kg,reps){if(!Number.isFinite(kg)||kg<=0||kg>1000||!Number.isInteger(reps)||reps<1||reps>10)return null;return reps===1?kg:kg*(1+reps/30)}
const estWork=(kg,reps)=>{const estimate=estimate1RM(kg,reps);return estimate===null?null:round25(estimate*.75)};

function paces(){
  let t2=toSec(state.runTimes.t2),t5=toSec(state.runTimes.t5);

function setupWheels(root,onChange){
  root.querySelectorAll('.wheel').forEach(el=>{
    const items=[...el.querySelectorAll('.it')];
    const mark=()=>{const i=Math.min(items.length-1,Math.max(0,Math.round(el.scrollTop/40)));items.forEach((x,j)=>x.classList.toggle('sel',j===i))};
    el.scrollTop=(+el.dataset.idx)*40;mark();
    let raf;el.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{mark();onChange&&onChange()})},{passive:true});
    items.forEach((x,i)=>x.addEventListener('click',()=>el.scrollTo({top:i*40,behavior:'smooth'})));
  });
}
let activeMetcon=null,wake=null,closeArm=0;
function newTimer(setSec,mode){mode=mode||'down';return{mode,setSec,ms:mode==='up'?0:setSec*1000,running:false,started:false,done:false,t0:0,laps:[],id:null}}
let timer=newTimer(600);

const tVal=()=>{const T=timer;if(!T.running)return T.ms;const el=Date.now()-T.t0;return T.mode==='down'?Math.max(0,T.ms-el):T.ms+el};
function fmtClock(ms,tenths){
  const t=Math.max(0,ms),s=tenths?Math.floor(t/1000):Math.ceil(t/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  const base=h?`${h}:${pad(m)}:${pad(sec)}`:`${m}:${pad(sec)}`;return tenths?`${base}.${Math.floor(t%1000/100)}`:base;
}

  try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400])}catch(e){}
}
function tStart(){const T=timer;if(T.mode==='down'&&T.ms<=0)return toast('Állíts be időt a görgőkkel.',true);T.t0=Date.now();T.running=true;T.started=true;T.done=false;clearInterval(T.id);T.id=setInterval(tTick,100);lockScreen();renderTimerBox()}

function tTick(){
  const T=timer,v=tVal(),d=$('#tmr-display');
  if(d){d.textContent=fmtClock(v,T.mode==='up');d.classList.toggle('warn',T.mode==='down'&&v<=10000&&v>0)}
  if(T.mode==='down'&&v<=0){clearInterval(T.id);T.running=false;T.ms=0;T.done=true;releaseScreen();beep3();renderTimerBox();toast('Lejárt az idő!')}

 function walk(v,depth=0){if(depth>12)fail();if(typeof v==='string'&&v.length>20000)fail();if(typeof v==='number'&&!Number.isFinite(v))fail();if(Array.isArray(v)){if(v.length>20000)fail();v.forEach(x=>walk(x,depth+1))}else if(v&&typeof v==='object'){for(const [k,x]of Object.entries(v)){if(['__proto__','constructor','prototype'].includes(k))fail();walk(x,depth+1)}}}
 walk(o);if(!o||o.app!=='strng-training'||!o.state||typeof o.state!=='object'||Array.isArray(o.state)||!Number.isInteger(o.v)||o.v<1||o.v>7)fail();
 const st=o.state,keys=['sq','bp','dl','ohp','pc'];
 for(const field of ['tm','work']){if(st[field]!==undefined){if(!st[field]||typeof st[field]!=='object'||Array.isArray(st[field]))fail();for(const[k,v]of Object.entries(st[field]))if(!keys.includes(k)||(v!==null&&(typeof v!=='number'||!Number.isFinite(v)||v<=0||v>1000)))fail()}}
 if(!Array.isArray(st.logs)||st.logs.length>20000)fail();
 const checkLog=l=>{if(!l||typeof l.id!=='string'||!l.id||l.id.length>128||!validDate(l.date))fail();if(l.part&&!['lift','strength','group','custom','run','metcon'].includes(l.part))fail();if(l.liftKey&&!keys.includes(l.liftKey))fail();for(const k of ['title','type','details','note','score','scoreType','scale','load','wodText'])if(l[k]!==undefined&&typeof l[k]!=='string')fail();if(l.title?.length>500||l.type?.length>100)fail();for(const k of ['amrapKg','amrapReps'])if(l[k]!==undefined&&(typeof l[k]!=='number'||!Number.isFinite(l[k])||l[k]<0))fail();if(l.amrapKg>1000||l.amrapReps>40||l.amrapReps!==undefined&&!Number.isInteger(l.amrapReps))fail();if(l.week!==undefined&&(!Number.isInteger(l.week)||l.week<0||l.week>4))fail();for(const f of ['sets','plannedSets'])if(l[f]!==undefined&&(!Array.isArray(l[f])||l[f].length>30||l[f].some(x=>!validSet(x))))fail()};
 st.logs.forEach(l=>{checkLog(l);if(l.distanceKm!==undefined&&(!Number.isFinite(l.distanceKm)||l.distanceKm<0||l.distanceKm>500))fail();if(l.durationSec!==undefined&&(!Number.isInteger(l.durationSec)||l.durationSec<0||l.durationSec>604800))fail();}); if(st.club!==undefined)validateMemberData(st.club);if(new Set(st.logs.map(l=>l.id)).size!==st.logs.length)fail();
 if(st.trash!==undefined){if(!Array.isArray(st.trash)||st.trash.length>20000)fail();st.trash.forEach(x=>{if(!x||!Number.isFinite(x.deletedAt))fail();checkLog(x.log)});if(new Set(st.trash.map(x=>x.log.id)).size!==st.trash.length)fail()}
 if(st.runTimes!==undefined){if(!st.runTimes||typeof st.runTimes!=='object'||Array.isArray(st.runTimes))fail();for(const[k,v]of Object.entries(st.runTimes))if(!['t2','t5'].includes(k)||typeof v!=='string'||v!==''&&!toSec(normalizeTime(v)))fail()}
 for(const k of ['lastBackup','cycleApplied','cycleAppliedBasic'])if(st[k]!==undefined&&(!Number.isFinite(st[k])||st[k]<0))fail();
 if(st.dailyWods!==undefined){if(!st.dailyWods||Array.isArray(st.dailyWods)||typeof st.dailyWods!=='object')fail();for(const[k,v]of Object.entries(st.dailyWods))if(!validDate(k)||typeof v!=='string')fail()}
 if(st.metconModes!==undefined){if(!st.metconModes||Array.isArray(st.metconModes)||typeof st.metconModes!=='object')fail();for(const[k,v]of Object.entries(st.metconModes))if(!METCONS.some(m=>m.id===k)||!['equipped','bodyweight'].includes(v))fail()}
 return o;
}

  const m2=/^w([sr])-(\w+)$/.exec(t.id||'');if(m2){const kg=Number($('#ws-'+m2[2])?.value),r=Number($('#wr-'+m2[2])?.value),o=$('#wk-'+m2[2]);if(o){const estimate=estWork(kg,r);o.value=estimate??'';o.placeholder=r>10?'10 ismétlés felett: add meg kézzel':'5×5 súly (kg)'}}

const CLOUD_CONFIG=window.STRNG_CONFIG||{url:'',anonKey:''};
let clubReady=true,clubWeek=weekStart(today()),activeClassId='',adminPreview=false;
const cloud={session:null,member:null,rev:0,ack:null,dirty:false,busy:false,status:'Helyi mentés',conflict:false,ready:false};
let clubDoc={classes:[],announcements:[],templates:[]},clubRev=0,clubFresh=false,adminMembers=[],cloudTimer;
function cleanMap(v){return v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).filter(([k])=>!['__proto__','constructor','prototype'].includes(k)).slice(0,20000)):{};}
function cleanMemberData(v){v=v||{};return{rsvps:cleanMap(v.rsvps),feedback:cleanMap(v.feedback),acks:cleanMap(v.acks),alternatives:cleanMap(v.alternatives)}}
function validateMemberData(v){if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Hibás tagsági napló.');for(const k of ['rsvps','feedback','acks','alternatives']){if(v[k]!==undefined&&(!v[k]||typeof v[k]!=='object'||Array.isArray(v[k])))throw Error('Hibás tagsági napló.')}for(const x of Object.values(v.rsvps||{}))if(typeof x!=='boolean')throw Error('Hibás jelentkezés.');for(const x of Object.values(v.alternatives||{}))if(typeof x!=='string'||x.length>2000)throw Error('Hibás alternatíva.');for(const x of Object.values(v.acks||{}))if(!Number.isFinite(x))throw Error('Hibás visszaigazolás.');for(const x of Object.values(v.feedback||{}))if(!x||!['easy','ok','hard'].includes(x.rating)||!validDate(x.date)||typeof x.note!=='string'||x.note.length>2000||typeof x.completed!=='boolean')throw Error('Hibás visszajelzés.');return true}
function addDays(d,n){const p=pd(d);p.setDate(p.getDate()+n);return ymd(p)}
function weekStart(d){const p=pd(d);return addDays(d,-((p.getDay()+6)%7))}
function huNow(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Budapest',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(' ','T')}
function pub(x){return x&&x.publishAt&&x.publishAt<=huNow()}
function visibleItem(x){return pub(x.published)?x.published:pub(x.previous)?x.previous:null}
function classes(){return clubDoc.classes.map(visibleItem).filter(Boolean).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function selectedClubClass(date){return classes().find(x=>x.id===activeClassId&&x.date===date&&x.status!=='cancelled')||classes().find(x=>x.date===date&&x.status!=='cancelled')}
function getClass(id){return classes().find(c=>c.id===id)}
function activeNotices(){const now=huNow();const notices=clubDoc.announcements.map(visibleItem).filter(x=>x&&x.startAt<=now&&x.endAt>now);for(const c of classes())if(c.status==='cancelled'&&c.date===today())notices.push({id:'cancel-'+c.id,title:`A mai ${c.time}-os ${c.type} elmarad`,body:c.changeNote||'',kind:'cancel',classId:c.id,revision:c.revision});return notices.sort((a,b)=>(a.kind==='cancel'?0:1)-(b.kind==='cancel'?0:1))}
function isAdmin(){return CLOUD_CONFIG.url?cloud.member?.role==='admin':adminUnlocked}
function canUseApp(){return !CLOUD_CONFIG.url||!!(cloud.ready&&cloud.member&&(cloud.member.role==='admin'||cloud.member.active_until>=today()))}
function safeLocalGet(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}
function localSet(k,v){localStorage.setItem(k,JSON.stringify(v))}
function clubCacheKey(){return 'strng_club_'+(cloud.session?.user?.id||'local')}
function loadClubCache(){const o=safeLocalGet(clubCacheKey(),null);if(o){try{clubDoc=validateClubDoc(o.doc);clubRev=o.rev||0}catch{}}}
function validateClubDoc(doc){if(!doc||!Array.isArray(doc.classes)||!Array.isArray(doc.announcements)||!Array.isArray(doc.templates)||doc.classes.length>3000||doc.announcements.length>500||doc.templates.length>200)throw Error('Hibás edzői adatcsomag.');const ids=new Set();for(const item of [...doc.classes,...doc.announcements]){if(!item||typeof item.id!=='string'||ids.has(item.id)||!/^[\w-]{1,100}$/.test(item.id))throw Error('Hibás azonosító.');ids.add(item.id);for(const x of [item.draft,item.published].filter(Boolean)){if(x.id!==item.id)throw Error('Hibás azonosító.');for(const [k,v]of Object.entries(x))if(typeof v==='string'&&(v.length>20000||['__proto__','constructor','prototype'].includes(k)))throw Error('Túl hosszú mező.');if(x.date&&(!validDate(x.date)||!/^\d{2}:\d{2}$/.test(x.time)||x.time>'23:59'))throw Error('Hibás óraidő.')}}return doc}
function paintClubStatus(){const e=$('#cloud-status');if(e)e.textContent=cloud.status;const badge=$('#badge');if(badge)badge.textContent=CLOUD_CONFIG.url?(cloud.member?.role==='admin'?'Edzői fiók':'STRNG-tag'):'Helyi változat'}
function field(id,label,value='',type='text',attrs=''){return `<label class="block"><span class="lbl">${esc(label)}</span><input class="field" id="${id}" type="${type}" value="${esc(value)}" ${attrs}></label>`}
function area(id,label,value='',rows=3){return `<label class="block"><span class="lbl">${esc(label)}</span><textarea class="field" id="${id}" rows="${rows}" maxlength="20000">${esc(value)}</textarea></label>`}
function value(id){return $('#'+id)?.value?.trim()||''}
function downloadText(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function closeButtons(action,label='Mentés',id=''){return `<div class="grid2"><button class="btn" data-a="closeModal">Mégse</button><button class="btn pri" data-a="${action}" data-id="${esc(id)}">${label}</button></div>`}
function weeklyStats(date=today(),data=state){const start=weekStart(date),end=addDays(start,7),logs=data.logs.filter(l=>l.date>=start&&l.date<end),runs=logs.filter(l=>l.part==='run'),f=Object.values(data.club?.feedback||{}).filter(f=>f.completed&&f.date>=start&&f.date<end);return{start,end,km:runs.reduce((n,l)=>n+(l.distanceKm||0),0),runs:runs.length,unmeasured:runs.filter(l=>!l.distanceKm).length,completed:f.length,planned:classes().filter(c=>c.date>=start&&c.date<end&&c.status!=='cancelled'&&data.club?.rsvps[c.id]).length}}
function summaryCard(){const s=weeklyStats(clubWeek),changes=LIFTS.map(l=>{const a=amrapSeries(state.logs,l.key).filter(x=>x.date<s.end),last=a.at(-1),prev=a.slice(0,-1).reverse().find(x=>x.kg===last?.kg);return last&&last.date>=s.start&&prev&&last.reps>prev.reps?`${shortLift(l.key)}: ${formatLoad(last.kg)} kg mellett +${last.reps-prev.reps} ismétlés`:''}).filter(Boolean);return `<section class="card"><div class="h">A heted számokban · ${esc(fmtDate(s.start))}</div><div class="grid2"><div class="stat"><b>${s.completed} / ${s.planned}</b><span>visszajelzett / tervezett óra</span></div><div class="stat"><b>${formatLoad(s.km)} km</b><span>${s.runs} naplózott futás</span></div></div>${changes.map(t=>`<p class="small ok">${esc(t)}</p>`).join('')}${s.unmeasured?'<p class="tiny mut">Régi futásnál hiányzik a táv; ezt nem becsüljük bele az összesítőbe.</p>':''}</section>`}
function noticeCard(n){const read=state.club.acks[n.id]===(n.revision||1);return `<article class="notice ${n.kind==='cancel'?'cancel-notice':'event-notice'}" role="status"><h3>${esc(n.title)}</h3>${n.body?`<p>${esc(n.body)}</p>`:''}<button class="btn sm" data-a="ackNotice" data-id="${esc(n.id)}" data-rev="${n.revision||1}">${read?'✓ Elolvastam':'Elolvastam'}</button></article>`}
function vHome(){const end=addDays(clubWeek,7),list=classes().filter(c=>c.date>=clubWeek&&c.date<end),notices=activeNotices(),targeted=classes().filter(c=>state.club.rsvps[c.id]&&c.changeNote&&state.club.acks['change-'+c.id]!==c.revision&&c.date>=today());return `<section class="card"><div class="row"><div><div class="h em">STRNG Fitness</div><h2>A heted, egy helyen.</h2></div>${isAdmin()&&!adminPreview?'<button class="btn sm" data-a="tab" data-t="admin">Admin</button>':''}</div><div class="row"><button class="btn sm" data-a="weekMove" data-n="-7" aria-label="Előző hét">←</button><b>${esc(fmtDate(clubWeek))} – ${esc(fmtDate(addDays(clubWeek,6)))}</b><button class="btn sm" data-a="weekMove" data-n="7" aria-label="Következő hét">→</button></div><div class="week-grid">${Array.from({length:7},(_,i)=>{const d=addDays(clubWeek,i),cs=list.filter(c=>c.date===d);return `<button class="week-day ${d===today()?'today':''} ${d===selectedDate?'selected':''}" data-a="selectHomeDay" data-date="${d}"><small>${pd(d).toLocaleDateString('hu-HU',{weekday:'short'})}</small><b>${pd(d).getDate()}</b><span>${cs.length?cs.length+' óra':'—'}</span></button>`}).join('')}</div><button class="btn sm" data-a="thisWeek">Aktuális hét</button></section>${notices.map(noticeCard).join('')}${targeted.map(c=>noticeCard({id:'change-'+c.id,title:`Változás · ${fmtDate(c.date)} ${c.time}`,body:c.changeNote,revision:c.revision,kind:'event'})).join('')}<div class="row"><h3>${esc(fmtDate(selectedDate))}</h3><button class="btn sm" data-a="refreshClub">Frissítés</button></div>${!clubFresh&&CLOUD_CONFIG.url?'<p class="tiny mut">Utolsó letöltött órarend. A frissítéshez internet szükséges.</p>':''}${list.filter(c=>c.date===selectedDate).map(classCard).join('')||'<section class="card empty-state">Erre a napra még nincs közzétett óra.</section>'}<details class="card"><summary>A teljes hét órái · ${list.length}</summary><div class="disclosure-content">${list.map(c=>`<button class="btn" data-a="selectHomeDay" data-date="${c.date}">${esc(fmtDate(c.date))} · ${esc(c.time)} · ${esc(c.type)}${c.status==='cancelled'?' · ELMARAD':''}</button>`).join('')||'<p class="mut">A heti terv még nem jelent meg.</p>'}</div></details>${summaryCard()}<p class="tiny mut" id="cloud-status">${esc(cloud.status)}</p>`}
function classCard(c){const planned=!!state.club.rsvps[c.id],fb=state.club.feedback[c.id],alt=state.club.alternatives[c.id]||'';return `<article class="card ${c.status==='cancelled'?'cancelled':''}"><div class="row"><span class="tag on">${esc(c.time)} · ${esc(c.type)}</span>${c.revision>1?'<span class="tag">Frissítve</span>':''}</div><h3>${esc(c.title||c.type)}</h3>${c.status==='cancelled'?'<p class="cancel-text">Ez az óra elmarad.</p>':`<div class="grid2"><button class="btn ${planned?'pri':''}" data-a="rsvp" data-id="${c.id}">${planned?'✓ Erre készülök':'Erre az órára készülök'}</button><button class="btn" data-a="openClass" data-id="${c.id}">Eredmény rögzítése</button></div><p class="tiny mut">A jelölés tervezésre szolgál, nem helyfoglalás.</p>${c.bookingUrl?`<a class="btn" href="${esc(safeUrl(c.bookingUrl))}" target="_blank" rel="noopener noreferrer">Foglalás</a>`:''}${c.strength?`<div><div class="h">Főgyakorlat</div><p class="pre">${esc(c.strength)}</p></div>`:''}<div class="wod-board"><div class="h em">WOD</div><pre>${esc(c.wod||'A részletes WOD hamarosan érkezik.')}</pre></div>${c.alternatives?`<details><summary>Edzői alternatívák</summary><p class="pre">${esc(c.alternatives)}</p><label class="lbl" for="alt-${c.id}">Ezt a változatot végeztem</label><input id="alt-${c.id}" class="field" maxlength="2000" value="${esc(alt)}"><button class="btn" data-a="saveAlternative" data-id="${c.id}">Változat mentése</button></details>`:''}${c.date<=today()?`<button class="btn" data-a="feedback" data-id="${c.id}">${fb?'✓ Edzés-visszajelzés módosítása':'Részt vettem · visszajelzés'}</button>`:''}`}${c.changeNote?`<p class="small mut">${esc(c.changeNote)}</p>`:''}</article>`}
function safeUrl(s){try{const u=new URL(s);return u.protocol==='https:'?u.href:'#'}catch{return '#'}}
function vRun(){const s=weeklyStats(today()),logs=state.logs.filter(l=>l.part==='run').sort((a,b)=>b.date.localeCompare(a.date));return `<section class="card"><div class="row"><div><div class="h em">Aktuális heti össztáv</div><h2>${s.runs?formatLoad(s.km)+' km':'Még nincs futás'}</h2></div><span class="tag">${s.runs} futás</span></div><button class="btn pri" data-a="freeRun">＋ Programon kívüli futás</button><p class="tiny mut">Minden mentett futás beleszámít.</p>${s.unmeasured?'<p class="small mut">Van korábbi futás megadott táv nélkül. Lent pótolhatod.</p>':''}</section>${originalRun()}<details class="card"><summary>Futásnapló · ${logs.length}</summary><div class="disclosure-content">${logs.map(l=>`<article class="log"><b>${esc(l.title)}</b><span>${esc(fmtDate(l.date))} · ${l.distanceKm?formatLoad(l.distanceKm)+' km':'táv nincs megadva'} · ${l.durationSec?fmtT(l.durationSec):'idő nincs megadva'}</span>${l.distanceKm&&l.durationSec?`<span class="small mut">${fmtPace(l.durationSec/l.distanceKm)} /km</span>`:''}<button class="btn sm" data-a="editRun" data-id="${esc(l.id)}">Módosítás</button></article>`).join('')||'<p>Még nincs futás.</p>'}</div></details>`}
function runEditor(ref='',id=''){const old=state.logs.find(l=>l.id===id),r=RUN_SESSIONS.find(x=>x.s.id===ref);modal(`<h3>${old?'Futás módosítása':r?r.s.title:'Programon kívüli futás'}</h3>${field('run-date','Dátum',old?.date||today(),'date')}${field('run-km','Tényleges össztáv · km',old?.distanceKm||'','text','inputmode="decimal" placeholder="5,2"')}${field('run-time','Teljes idő · MM:SS',old?.durationSec?fmtT(old.durationSec):'','text','inputmode="numeric" placeholder="32:15"')}${area('run-note','Megjegyzés',old?.note||'',2)}<p class="tiny mut">A teljes futás távját és idejét add meg. A program bejelölése önmagában nem becsül megtett kilométert.</p><div class="grid2"><button class="btn" data-a="closeModal">Mégse</button><button class="btn pri" data-a="saveRun" data-ref="${esc(ref)}" data-id="${esc(id)}">Mentés</button></div>`)}

A.unlockAdmin=async()=>{if(Date.now()<adminRetryAt){$('#admin-error').textContent='Várj egy percet, majd próbáld újra.';return}const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value('admin-password')));const digest=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');if(digest!==ADMIN_DIGEST){adminFailures++;if(adminFailures>=5){adminRetryAt=Date.now()+60000;adminFailures=0}$('#admin-error').textContent='Hibás jelszó.';return}adminUnlocked=true;adminLastUse=Date.now();adminFailures=0;closeModal();clubWeek=weekStart(selectedDate);tab='admin';render()};
A.lockAdmin=()=>{adminUnlocked=false;adminPreview=false;tab='program';closeModal();render()};
A.saveAndPublish=d=>A.saveClassDraft({...d,publish:true});
A.applySchedule=async()=>{if(!isAdmin())return;const pattern=value('schedule-pattern'),time=value('schedule-time'),sw=Number(value('schedule-week'));if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))return toast('Adj meg érvényes kezdési időt.',true);if(!await ask('Heti főgyakorlatok','A kiválasztott hét minden hétköznapi órájának főgyakorlatát és erőprogramhetét módosítjuk. A WOD változatlan marad. Az üres napokra új órát készítünk.','Alkalmazás'))return;const offset=((Math.round((pd(clubWeek)-pd('2026-11-02'))/604800000)%4)+4)%4,rotation=['sq','bp','dl','ohp'];if(await mutateClub(()=>{for(let i=0;i<5;i++){const date=addDays(clubWeek,i),key=pattern==='C'?rotation[(i+offset)%4]:WEEK_PATTERNS[pattern][i],existing=clubDoc.classes.filter(x=>(x.draft||x.published)?.date===date);if(!existing.length){const id=uid();existing.push({id});clubDoc.classes.push(existing[0])}for(const x of existing){const old=x.draft||x.published||{id:x.id,date,time,type:'STRNG Fitness',status:'scheduled',wod:'',title:''};x.previous=visibleItem(x);x.published={...old,liftKey:key,strengthWeek:sw,publishAt:huNow(),revision:(x.published?.revision||0)+1};delete x.draft}}})){render();toast('A heti főgyakorlatok megjelentek az Edzés lapon.')}};
A.saveWodNote=()=>{if(selectedDate>today())return;const note=value('guest-wod-note');if(!note)return toast('Írd be a megjegyzést.',true);const old=state.logs.find(l=>l.part==='group'&&sameWod(l,selectedDate)),record={...old,id:old?.id||uid(),createdAt:old?.createdAt||Date.now(),date:selectedDate,classId:selectedClubClass(selectedDate)?.id||'',part:'group',type:'Csoportos WOD',title:'WOD · megjegyzés',score:'',note,details:note};if(persistChange(()=>{if(old)state.logs[state.logs.indexOf(old)]=record;else state.logs.unshift(record)})){wodDrafts.delete(wodKey(selectedDate));render();toast('Megjegyzés mentve.')}};
A.editGroupWod=()=>{};A.saveGroupWod=()=>{};
A.exportPublicPlan=()=>{if(!isAdmin())return;const publicDoc={classes:clubDoc.classes.filter(x=>x.published).map(x=>({id:x.id,published:x.published,...(x.previous?{previous:x.previous}:{})})),announcements:clubDoc.announcements.filter(x=>x.published).map(x=>({id:x.id,published:x.published,...(x.previous?{previous:x.previous}:{})})),templates:[]};downloadText('strng-plan.json',JSON.stringify({app:'strng-public-plan',version:1,publishedAt:new Date().toISOString(),doc:publicDoc},null,2));toast('A strng-plan.json fájlt töltsd fel a GitHub repóba.')};
async function fetchPublicPlan(){if(CLOUD_CONFIG.url||isAdmin()||location.protocol==='file:')return;try{const response=await fetch('./strng-plan.json',{cache:'no-store'});if(!response.ok)throw Error('missing');const text=await response.text();if(text.length>2*1024*1024)throw Error('size');const data=JSON.parse(text);if(data.app!=='strng-public-plan'||data.version!==1)throw Error('format');const doc=validateClubDoc(data.doc);if(isAdmin()||clubSaving)return;if((safeLocalGet('strng_local_plan_updated',0)||0)>Date.parse(data.publishedAt)){clubFresh=true;return}clubDoc=doc;localSet(clubCacheKey(),{doc:clubDoc,rev:clubRev});clubFresh=true}catch{clubFresh=false}}
// Keep guest refresh from overwriting unpublished local coach edits.
const cacheBefore=clubCacheKey;clubCacheKey=function(){return !CLOUD_CONFIG.url&&isAdmin()?'strng_club_admin_local':cacheBefore()};
const unlockBefore=A.unlockAdmin;A.unlockAdmin=async()=>{await unlockBefore();if(isAdmin()){loadClubCache();render()}};
const lockBefore=A.lockAdmin;A.lockAdmin=async()=>{const preview=clubDoc;lockBefore();clubDoc=preview;render()};
document.addEventListener('click',()=>{if(adminUnlocked)adminLastUse=Date.now()});
document.addEventListener('input',()=>{if(adminUnlocked)adminLastUse=Date.now()});
setInterval(()=>{if(adminUnlocked&&Date.now()-adminLastUse>15*60*1000)A.lockAdmin()},30000);
// Every administrative action checks the local gate; server mode additionally uses SQL authorization.
for(const name of ['editClass','saveClassDraft','saveAndPublish','publishClass','publishWeek','confirmPublishWeek','copyWeek','confirmCopyWeek','saveTemplate','useTemplate','deleteTemplate','deleteDraft','cancelClass','editNotice','saveNotice','withdrawNotice','exportClub','exportContacts','copyNewsletter','guestPreview','applySchedule','exportPublicPlan']){const action=A[name];A[name]=function(...args){if(!isAdmin())return toast('Edzői belépés szükséges.',true);return action(...args)}}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='admin-password'){e.preventDefault();A.unlockAdmin()}});

/* Home sessions are authored content, separate from the group-class WOD. */
const HOME_WORKOUTS=[{id:'home-lunge-vup-burpee-01',title:'Lunge · V-up · Burpee',format:'For time',rounds:[[40,40,20],[30,30,15],[20,20,10]],movements:['Alternating Weighted Lunge','V-up','Burpee']}];
function homeWorkoutText(w){return w.rounds.map((round,i)=>`${i+1}. kör\n`+round.map((n,j)=>`${n} ${w.movements[j]}`).join('\n')).join('\n\n')}
function homeLogs(id){return state.logs.filter(l=>l.part==='metcon'&&l.refId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt)}
function vAtHome(){return `<section class="card"><div class="h em">STRNG · Otthon</div><h2>Otthoni edzések</h2><p class="small mut">Válassz edzést, majd mentsd az eredményedet.</p></section>${HOME_WORKOUTS.map((w,index)=>{const logs=homeLogs(w.id);return `<article class="card"><div class="row"><span class="tag on">${pad(index+1)} · ${w.format}</span><span class="tiny mut">3 kör</span></div><h3>${esc(w.title)}</h3><div class="home-rounds">${w.rounds.map((round,i)=>`<section class="sub"><div class="h">${i+1}. kör</div>${round.map((n,j)=>`<p class="home-movement"><strong>${n}</strong><span>${esc(w.movements[j])}</span></p>`).join('')}</section>`).join('')}</div><p class="tiny mut">A kitörések összesített ismétlések, váltott lábbal. A súlyt te választod.</p><button class="btn pri" data-a="homeLog" data-ref="${w.id}">Idő és eredmény mentése</button>${logs.length?`<details><summary>Korábbi eredmények · ${logs.length}</summary>${logs.map(l=>`<article class="log"><b>${esc(fmtDate(l.date))} · ${esc(l.score||'Mentett eredmény')}</b><p class="small pre">${esc(l.note||'')}</p><button class="btn sm" data-a="homeLog" data-ref="${w.id}" data-id="${esc(l.id)}">Módosítás</button></article>`).join('')}</details>`:''}</article>`}).join('')}<details class="card"><summary>Korábbi edzéstár</summary><p class="small mut">A korábbi metconok továbbra is elérhetők.</p><button class="btn" data-a="tab" data-t="metcon">Edzéstár megnyitása</button></details>`}
A.progressMetric=d=>{if(!['weight','estimated'].includes(d.m))return;graphMetric=d.m;render()};
A.homeLog=d=>{const w=HOME_WORKOUTS.find(x=>x.id===d.ref);if(!w)return;const old=d.id?homeLogs(w.id).find(l=>l.id===d.id):null;modal(`<h3>${esc(w.title)}</h3>${field('home-date','Dátum',old?.date||today(),'date',`max="${today()}"`)}${field('home-time','Teljes idő · MM:SS',old?.score||'','text','inputmode="text" placeholder="18:30"')}${area('home-note','Súly és megjegyzés',old?.note||'',3)}<p class="tiny mut">Írd ide a használt súlyt és az esetleges módosításokat.</p><div class="grid2"><button class="btn" data-a="closeModal">Mégse</button><button class="btn pri" data-a="saveHomeLog" data-ref="${w.id}" data-id="${old?.id||''}">${old?'Frissítés':'Mentés'}</button></div>`)};
A.saveHomeLog=d=>{const w=HOME_WORKOUTS.find(x=>x.id===d.ref);if(!w)return;const date=value('home-date'),score=value('home-time'),match=/^(\d{1,3}):([0-5]\d)$/.exec(score),seconds=match?+match[1]*60 + +match[2]:0,note=value('home-note');if(!validDate(date)||date>today()||seconds<=0)return toast('Mai vagy korábbi dátumot és pozitív MM:SS időt adj meg.',true);const old=d.id?homeLogs(w.id).find(l=>l.id===d.id):null;if(d.id&&!old)return toast('Ez a bejegyzés már nem található.',true);const row={...old,id:old?.id||uid(),createdAt:old?.createdAt||Date.now(),date,part:'metcon',refId:w.id,type:'Otthoni edzés',title:w.title,score:fmtT(seconds),scoreType:'time',note,details:homeWorkoutText(w)+'\n\nIdő: '+fmtT(seconds)+(note?'\n'+note:'')};if(!persistChange(()=>{if(old)state.logs[state.logs.indexOf(old)]=row;else state.logs.unshift(row)}))return;closeModal();tab='athome';render();toast('Otthoni edzés elmentve.')};

render();
bootClub();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
registerWorker();refreshCoachWods();
